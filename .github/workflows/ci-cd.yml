name: RAG CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# ✅ Prevent multiple queued runs
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run basic checks
        run: |
          echo "No tests configured yet"

      - name: Build Docker image
        run: |
          docker build -t medical-rag .

      - name: Login to DockerHub (using PAT)
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag and Push Docker image
        run: |
          docker tag medical-rag ${{ secrets.DOCKER_USERNAME }}/medical-rag:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/medical-rag:latest
